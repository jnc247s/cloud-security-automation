name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudsec_test
          POSTGRES_USER: cloudsec
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudsec -d cloudsec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudsec:ci_test_password@localhost:5432/cloudsec_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Set up dashboard Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install pinned dashboard tooling
        run: |
          npm install --global pnpm@11.19.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium firefox

      - name: Validate dashboard client
        run: |
          pnpm --dir frontend typecheck
          pnpm --dir frontend lint
          pnpm --dir frontend test
          pnpm --dir frontend build

      - name: Browser acceptance with controlled issuer and disposable PostgreSQL
        env:
          DASHBOARD_BROWSER_TEST: "1"
          PYTHON_EXECUTABLE: python
          TEST_DATABASE_URL: postgresql+psycopg://cloudsec:ci_test_password@127.0.0.1:5432/cloudsec_test
        run: pnpm --dir frontend test:browser

      - name: Build API container
        run: docker build -t cloud-security-automation:ci .
