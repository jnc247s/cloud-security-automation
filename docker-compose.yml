name: cloud-security-automation

services:
  api:
    build:
      context: .
    environment:
      APP_ENV: "${APP_ENV:-development}"
      AWS_PROFILE: "${AWS_PROFILE:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-cloudsec}:${POSTGRES_PASSWORD:-cloudsec_dev_password}@db:5432/${POSTGRES_DB:-cloudsec}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      REQUIRED_TAGS: "${REQUIRED_TAGS:-Owner,Environment}"
      STALE_ACCESS_KEY_DAYS: "${STALE_ACCESS_KEY_DAYS:-90}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-cloudsec}:${POSTGRES_PASSWORD:-cloudsec_dev_password}@db:5432/${POSTGRES_DB:-cloudsec}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cloudsec}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cloudsec_dev_password}"
      POSTGRES_USER: "${POSTGRES_USER:-cloudsec}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
